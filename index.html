<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mini App iPhone</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f7f9ff, #e8eeff);
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(460px, 100%);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      padding: 24px;
      text-align: center;
    }
    h1 { margin-top: 0; color: #1f2a44; }
    button {
      width: 100%;
      font-size: 1.1rem;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #007aff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #mensaje {
      min-height: 1.5em;
      margin: 16px 0;
      font-size: 1.4rem;
      color: #0b5;
      font-weight: 700;
    }
    .github-link {
      display: inline-block;
      margin: 8px 0 16px;
      word-break: break-all;
      color: #0a58ca;
      text-decoration: none;
      font-weight: 600;
    }
    .github-link:hover { text-decoration: underline; }
    .qr img {
      width: min(320px, 80vw);
      height: auto;
      border-radius: 12px;
      border: 1px solid #d7def5;
      background: #fff;
    }
    .hint {
      margin-top: 10px;
      color: #4a5678;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mini app para iPhone</h1>

    <button id="btn-hola" type="button">Pulsa aquí</button>
    <p id="mensaje" aria-live="polite"></p>

    <p>GitHub Web de la app:</p>
    <a class="github-link" href="https://nestorguerra.github.io/miniapp-html/" target="_blank" rel="noopener noreferrer">
      https://nestorguerra.github.io/miniapp-html/
    </a>

    <section class="qr" aria-label="Código QR de la app">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=700x700&data=https://nestorguerra.github.io/miniapp-html/" alt="Código QR para abrir la app publicada en GitHub Pages">
      <p class="hint">Haz una foto o escanéalo con la cámara del iPhone para abrir la app directamente.</p>
    </section>
  </main>

  <script>
    document.getElementById('btn-hola').addEventListener('click', function () {
      document.getElementById('mensaje').textContent = 'Hola mundo';
    });
  </script>
</body>
</html>
