<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mini App iPhone</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f7f9ff, #e8eeff);
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: min(420px, 100%);
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #1f2a44;
    }

    button {
      width: 100%;
      font-size: 1.1rem;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #007aff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #mensaje {
      min-height: 1.5em;
      margin: 16px 0 8px;
      font-size: 1.4rem;
      color: #0b5;
      font-weight: 700;
    }

    .qr {
      margin-top: 16px;
    }

    .qr img {
      width: 200px;
      height: 200px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mini app para iPhone</h1>
    <button id="btn-hola" type="button">Pulsa aquí</button>
    <p id="mensaje" aria-live="polite"></p>

    <section class="qr" aria-label="Código QR de la app">
      <p>Escanea este QR para abrir la app en tu móvil:</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://nestorguerra.github.io/miniapp-html/" alt="Código QR hacia la app publicada en GitHub Pages">
    </section>
  </main>

  <script>
    document.getElementById('btn-hola').addEventListener('click', function () {
      document.getElementById('mensaje').textContent = 'Hola mundo';
    });
  </script>
</body>
</html>
