<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mini App iPhone</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f7f9ff, #e8eeff);
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(460px, 100%);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      padding: 24px;
      text-align: center;
    }
    h1 { margin-top: 0; color: #1f2a44; }
    button {
      width: 100%;
      font-size: 1.1rem;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #007aff;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #mensaje {
      min-height: 1.5em;
      margin: 16px 0;
      font-size: 1.4rem;
      color: #0b5;
      font-weight: 700;
    }
    .github-link {
      display: inline-block;
      margin: 8px 0 16px;
      word-break: break-all;
      color: #0a58ca;
      text-decoration: none;
      font-weight: 600;
    }
    .github-link:hover { text-decoration: underline; }
    .qr {
      display: grid;
      place-items: center;
      gap: 10px;
    }
    #qrcode {
      background: #fff;
      border: 1px solid #d7def5;
      border-radius: 12px;
      padding: 10px;
      line-height: 0;
    }
    #qrcode img,
    #qrcode canvas {
      width: min(320px, 80vw) !important;
      height: min(320px, 80vw) !important;
      display: block;
      border-radius: 8px;
    }
    .hint {
      margin-top: 2px;
      color: #4a5678;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mini app para iPhone</h1>

    <button id="btn-hola" type="button">Pulsa aquí</button>
    <p id="mensaje" aria-live="polite"></p>

    <p>GitHub Web de la app:</p>
    <a id="app-link" class="github-link" href="https://nestorguerra.github.io/miniapp-html/" target="_blank" rel="noopener noreferrer">
      https://nestorguerra.github.io/miniapp-html/
    </a>

    <section class="qr" aria-label="Código QR de la app">
      <div id="qrcode" aria-hidden="true"></div>
      <p class="hint">Este QR abre directamente la app de GitHub Pages.</p>
      <p class="hint">Si no se ve el QR, abre este enlace: <a href="https://nestorguerra.github.io/miniapp-html/">ir a la app</a>.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const appUrl = 'https://nestorguerra.github.io/miniapp-html/';

    document.getElementById('btn-hola').addEventListener('click', function () {
      document.getElementById('mensaje').textContent = 'Hola mundo';
    });

    new QRCode(document.getElementById('qrcode'), {
      text: appUrl,
      width: 700,
      height: 700,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
